name: smartstitch
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2
  socket_io_client: ^2.0.3+1
  http: ^1.2.0
  mime: ^2.0.0
  google_sign_in: ^6.2.1
  geolocator: ^14.0.0
  geocoding: ^4.0.0
  permission_handler: ^12.0.0
  safepay_checkout: ^1.0.6
  shared_preferences: ^2.2.2
  device_info_plus: ^10.0.0
  just_audio: ^0.9.40
  image_picker: ^1.1.2
  record: ^6.2.1
  path_provider: ^2.1.4
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0
  speech_to_text: ^7.0.0
  cloud_functions: ^5.1.3
  flutter_staggered_grid_view: ^0.7.0 
  pdf: ^3.11.3
  share_plus: ^11.0.0
  universal_html: ^2.2.4
  google_mlkit_pose_detection: ^0.12.0
  camera: ^0.11.0
  image: ^4.2.0     
  cloudinary_flutter: ^1.3.0
  cloudinary_url_gen: ^1.5.0
  cloudinary_public: ^0.23.1
  fl_chart: ^0.69.0
  excel: ^4.0.6
  open_file: ^3.5.10
  printing: ^5.13.3
  # State Management
  get: ^4.6.6
  webview_flutter: ^4.7.0

  # UI
  cupertino_icons: ^1.0.6
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  flutter_markdown: ^0.7.3
  dio: ^5.4.0
  flutter_stripe: ^11.1.0

  # AI
  google_generative_ai: ^0.4.6

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  url_launcher: ^6.2.4
  google_maps_flutter: ^2.5.3
  crypto: ^3.0.3
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  flutter_dotenv: ^5.2.1
  emoji_picker_flutter: ^3.1.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/payments/
    - assets/icon/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0E8F95"
  adaptive_icon_foreground: "assets/icon/icon.png"