<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Payment Cancelled</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e1114;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card { max-width: 420px; }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #c0392b;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 36px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #a0a6ad; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
    button {
      background: #0E8F95;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✕</div>
    <h1>Payment Cancelled</h1>
    <p>You can safely close this tab and return to your SmartStitch app to try again.</p>
    <button onclick="tryClose()">Close This Tab</button>
  </div>
  <script>
    function tryClose() {
      window.close();
    }
    setTimeout(tryClose, 1500);
  </script>
</body>
</html>
